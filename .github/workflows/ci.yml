name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # mock.module() and --experimental-test-module-mocks landed in Node
        # 22.3.0. This is also the package.json engines.node floor, so the full
        # suite now exercises the oldest supported runtime instead of relying
        # on a partial smoke job for an EOL Node line.
        # 24 is current Active LTS (nodejs/Release schedule, Krypton).
        node: ['22.3.x', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # Zero runtime dependencies; package-lock.json pins only the lint
          # devDependency, so caching one small lockfile buys nothing.
          package-manager-cache: false

      # package-lock.json exists (076-T6b, one devDependency: eslint), so
      # `npm ci` now installs it deterministically; it is a no-op otherwise
      # since the package still ships zero runtime dependencies.
      - name: Install
        run: npm ci

      # The lint gate (cyclomatic complexity) runs on the Node 24 jobs only
      # (both OSes) — it is a code-quality gate, not a per-runtime behaviour
      # check, so it does not need to run on the Node 22.3 jobs too.
      - name: Lint
        if: matrix.node == '24'
        run: npm run lint

      # Keep the quote-free glob so Git Bash expands tests/*.test.mjs to real
      # paths consistently on both runner OSes. GitHub-hosted windows-latest
      # includes Git Bash, so this form is identical on both OSes.
      - name: Test
        shell: bash
        run: node --test --experimental-test-module-mocks tests/*.test.mjs

      - name: Manifest version parity
        run: node scripts/check-manifests.mjs

      # Same job shape (stock Node, no extra checkout flags). --check reports
      # git-tag presence but does not fail on a missing tag: tagging is the
      # maintainer's act, and this checkout does not fetch tags.
      - name: Version changelog agreement
        run: node scripts/bump-version.mjs --check

      - name: Package contents
        run: |
          npm pack --dry-run
          node scripts/check-pack.mjs

      # claude plugin validate . --strict is not run here.
      # @anthropic-ai/claude-code is on npm and `plugin validate` is documented
      # as local, but installing the full Claude Code CLI (native binary, first-run
      # setup, Windows .cmd shim) into every matrix cell is not a clean CI
      # dependency. No standalone plugin-validator is published. Do not fake it.
