# Dependabot keeps the GitHub Actions pins current. The package has zero
# runtime dependencies but one development dependency (eslint, the lint
# gate) and a lockfile (076-T6b), so the npm ecosystem entry below is
# active: its first PR is the eslint major bump.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
