# Codex implicit-invocation interface for antigravity-plugin.
#
# Codex's plugin loader reads this file at the plugin install root to learn
# how to surface the plugin as an implicit `$antigravity` shortcut, and what
# the default reasoning prompt should be when the user types `$antigravity`.
#
# All host surfaces (Claude Code slash commands, Codex `$antigravity`, agy
# native plugin commands, and the standalone
# `npx @southcarpet/antigravity-plugin <verb>` CLI) shell out to the SAME
# per-verb runtime modules under
# `scripts/commands/<verb>.mjs`. The verbs listed below are the public
# contract — keep them in sync with `commands/` and `scripts/commands/`.

interface:
  display_name: "Antigravity"
  short_description: "Hand off to Google Antigravity CLI (agy) for code review, large-context investigation, debugging, long-running tasks, or image analysis."
  default_prompt: "Use $antigravity when a task benefits from agy's large-context window, a second-opinion reasoning pass, or looking at an image — typical cases include cross-file code review, adversarial review of recent changes, refactor impact analysis, deep debugging, image questions via $antigravity vision, or running a long task in the background while the host continues other work."

policy:
  allow_implicit_invocation: true

# Verbs exposed under the `$antigravity` shortcut. Each one runs the
# corresponding `scripts/commands/<verb>.mjs` module via the per-host bridge,
# so a Codex invocation of `$antigravity review --base main` resolves to the
# same code path as Claude Code's `/antigravity:review --base main` and the
# standalone `npx @southcarpet/antigravity-plugin review --base main`
# (agy-native installs use that standalone dispatcher; agy has no
# `plugin run`).
commands:
  - name: setup
    description: "One-time agy OAuth wizard (foreground). Idempotent. Also registers the vision MCP server; --skip-vision to opt out, --remove-vision to undo plugin-owned entries. It warns when agy models does not list the default vision and media model. --json prints one envelope."
  - name: review
    description: "Hand the current git diff (or `--base <ref>`) to agy for a structured code review. Foreground by default; pass --background to fork a worker and poll with $antigravity status. Supports --model, --model-alias <alias> (a model family resolved from agy models), --effort <low|medium|high|agy-default> (no plugin default), an optional --focus <text> to narrow attention, --preview to show what would be sent without calling agy, --require-complete to refuse an input that skipped a file or cut the diff, --findings-json to also get structured findings, checked against the plugin's schema, in details.findings, --check-locations to heuristically check each path:line citation against the sent diff's own hunks (local only, adds nothing to the agy call), --models <a,b> to run the same review against two models and compare their findings (needs --findings-json; foreground only; two agy calls), and (with --background --wait) --show-result to print the finished job instead of the queued notice."
  - name: rescue
    description: "Delegate an investigation or fix request to agy, for example 'why are the tests failing on main'. Foreground by default; --background returns a job id for $antigravity status / result. Supports --model, --model-alias <alias>, --effort <low|medium|high>, --prompt-file <path> to read the request from a file (`-` reads stdin, standalone CLI only), --preview to show the request without calling agy, (with --background --wait) --show-result, and (with --background) --request-id <id> for an idempotent dispatch."
  - name: task
    description: "Generic long-running task delegation. Background by default; --foreground to inline, --wait to block. Supports --continue / --conversation <id> / --add-dir / --model / --model-alias <alias> / --effort <low|medium|high> for follow-up agy conversations, --preview to show the request without calling agy, --prompt-file <path> to read the prompt from a file instead of typing it (cannot combine with a positional prompt; `-` reads stdin, standalone CLI only, not through this host), --show-result (with --wait, on the background path) to print the finished job instead of the queued notice, and --request-id <id> (background path only) so a repeat of the same request reports the existing job instead of starting a new one."
  - name: media
    description: "Analyze local audio/video or one YouTube video. Supports --prompt, --model, --model-alias, --expect, --quality 360p|480p|720p, --audio, --transcript (with --timestamps), --keep, --output <path>, --preview (no download, no agy call), --json, --cwd. YouTube needs yt-dlp; merging needs ffmpeg."
  - name: vision
    description: "Ask agy to look at one or more image files (--prompt, --model, --model-alias, --expect <text> repeatable, --preview, --json). Foreground-only; requires setup to have registered the vision MCP server."
  - name: status
    description: "Show current and recent agy jobs, including any pending OAuth URL. With a job id and --wait, --exit-status exits by that job's own outcome instead of the usual 0."
  - name: result
    description: "Print the stored final output of a completed agy job by id, or part of it with --head / --tail. --check-locations runs the same heuristic path:line citation check `review` runs, from the stored answer, even on a job reviewed without that flag. --check-current compares a stored review input with git now (match, changed or unknown). --export <path> writes the full stored record to a new file and never overwrites."
  - name: cancel
    description: "Send SIGTERM to a running agy worker by job id."
  - name: doctor
    description: "Read-only environment and configuration check: Node version, the agy binary and version, which forwarded flags agy --help lists, the vision configuration, and the job-state root. --receipt prints a redacted compatibility receipt to share in a bug report. Never runs OAuth, never calls a model, never writes a file, never opens the network."

# Auth notes (surfaced via SKILL.md too):
# - agy 1.0.x is OAuth-only — there is no API-key / headless path. The very
#   first `$antigravity` invocation in a new account will block on an OAuth
#   URL printed to stdout. Run `$antigravity setup` once, follow the URL in
#   a browser, then re-issue the original command.
# - Background workers capture the OAuth URL and surface it on `$antigravity
#   status` so users in non-interactive sessions can still complete auth.

# See SKILL.md and docs/INSTALL.md for the full invocation contract.
